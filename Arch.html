<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Architecture Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .tree-container {
            padding: 30px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .tree {
            list-style: none;
        }

        .tree-item {
            margin: 4px 0;
            position: relative;
        }

        .tree-content {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tree-content:hover {
            background: #f0f4ff;
        }

        .tree-content.active {
            background: #e3f2fd;
        }

        .toggle-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            transition: transform 0.2s ease;
        }

        .toggle-icon.expanded {
            transform: rotate(90deg);
        }

        .item-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .item-name {
            font-weight: 500;
            color: #2c3e50;
            
        }

        .item-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 600;
            margin-left: 10px;
        }

        .item-badge.python {
            background: #fff3e0;
            color: #f57c00;
        }

        .item-badge.config {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .item-badge.html {
            background: #fce4ec;
            color: #c2185b;
        }

        .item-badge.css {
            background: #e8f5e9;
            color: #388e3c;
        }

        .item-badge.js {
            background: #fff9c4;
            color: #f57f17;
        }

        .children {
            list-style: none;
            margin-left: 24px;
            padding-left: 16px;
            border-left: 2px solid #e0e0e0;
            display: none;
            margin-top: 4px;
        }

        .children.expanded {
            display: block;
        }

        .description {
            margin-left: 40px;
            padding: 2px 0 4px 0;
            font-size: 0.75rem;
            color: #888;
            line-height: 1.3;
            display: block;
            font-style: italic;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .description ul {
            margin-left: 20px;
            margin-top: 8px;
        }

        .description li {
            margin: 4px 0;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #667eea;
            color: white;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>

</head>


<body>

        <div class="tree-container">
            <ul class="tree" id="treeRoot"></ul>
        </div>

        <div class="controls">
            <button class="btn" onclick="expandAll()">Expand All</button>
            <button class="btn btn-secondary" onclick="collapseAll()">Collapse All</button>
        </div>
    </div>

        function getIcon(type) {
            if (type === 'folder') return '📁';
            return '📄';
        }

        function createTreeItem(item, level = 0) {
            const li = document.createElement('li');
            li.className = 'tree-item';

            const content = document.createElement('div');
            content.className = 'tree-content';

            if (item.type === 'folder') {
                const toggle = document.createElement('span');
                toggle.className = 'toggle-icon';
                toggle.innerHTML = '▶';
                content.appendChild(toggle);
            } else {
                const spacer = document.createElement('span');
                spacer.style.width = '16px';
                spacer.style.marginRight = '8px';
                content.appendChild(spacer);
            }

            const icon = document.createElement('span');
            icon.className = 'item-icon';
            icon.textContent = getIcon(item.type);
            content.appendChild(icon);

            const name = document.createElement('span');
            name.className = 'item-name';
            name.textContent = item.name;
            content.appendChild(name);

            if (item.badge) {
                const badge = document.createElement('span');
                badge.className = `item-badge ${item.badge}`;
                badge.textContent = item.badge;
                content.appendChild(badge);
            }

            li.appendChild(content);

            if (item.description) {
                const desc = document.createElement('div');
                desc.className = 'description';
                desc.innerHTML = item.description;
                li.appendChild(desc);
            }

            if (item.children && item.children.length > 0) {
                const childrenUl = document.createElement('ul');
                childrenUl.className = 'children';
                
                item.children.forEach(child => {
                    childrenUl.appendChild(createTreeItem(child, level + 1));
                });
                
                li.appendChild(childrenUl);

                content.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const toggle = content.querySelector('.toggle-icon');
                    const children = li.querySelector('.children');
                    
                    if (children.classList.contains('expanded')) {
                        children.classList.remove('expanded');
                        toggle.classList.remove('expanded');
                    } else {
                        children.classList.add('expanded');
                        toggle.classList.add('expanded');
                    }
                });
            }

            return li;
        }

        function expandAll() {
            document.querySelectorAll('.children').forEach(children => {
                children.classList.add('expanded');
            });
            document.querySelectorAll('.toggle-icon').forEach(toggle => {
                toggle.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.children').forEach(children => {
                children.classList.remove('expanded');
            });
            document.querySelectorAll('.toggle-icon').forEach(toggle => {
                toggle.classList.remove('expanded');
            });
        }

        const treeRoot = document.getElementById('treeRoot');
        treeRoot.appendChild(createTreeItem(projectStructure));
    </script>

</html>
